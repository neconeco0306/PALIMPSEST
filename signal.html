<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>03:00 SIGNAL</title>
<meta name="theme-color" content="#050505">
<style>
:root{--bg:#050505;--fg:#f5f5f1;--muted:#7f7f7a;--line:#242424;--glow:#d8ff72}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow:hidden}
body{min-height:100dvh;display:grid;place-items:center}canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.48;pointer-events:none}
.shell{position:relative;width:min(920px,100%);min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--glow);box-shadow:0 0 16px var(--glow);margin-right:8px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}.main{display:grid;align-content:center;gap:22px}.kicker{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.idea{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:clamp(30px,7vw,74px);line-height:1.02;letter-spacing:-.045em;font-weight:740;max-width:12.6em;text-wrap:balance;transition:opacity .18s ease,transform .18s ease}
.idea.swap{opacity:0;transform:translateY(8px)}.meta{display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:11px;color:#b4b4ad;background:#090909aa;backdrop-filter:blur(8px)}
.prompt{max-width:690px;color:#a8a8a2;font-size:13px;line-height:1.7;border-left:1px solid #3b3b38;padding-left:13px}.bottom{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.counter{font-size:10px;color:#595955;line-height:1.6}
button{appearance:none;border:1px solid #343431;background:#0b0b0b;color:var(--fg);min-width:132px;height:50px;border-radius:16px;font:inherit;font-size:12px;letter-spacing:.08em;cursor:pointer;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #000;touch-action:manipulation}
button:active{transform:scale(.985)}button:before{content:"";position:absolute;inset:auto 16px 0;height:1px;background:linear-gradient(90deg,transparent,var(--glow),transparent);opacity:.7}
.scan{position:fixed;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 0 49.5%,rgba(255,255,255,.018) 50%,transparent 50.5%);background-size:100% 8px;mix-blend-mode:screen;opacity:.3}
@media(min-width:720px){.shell{padding:28px 36px 30px}.prompt{font-size:14px}.chip{font-size:12px}}
</style>
</head>
<body>
<canvas id="field"></canvas><div class="scan"></div>
<div class="shell">
<header class="top"><div><span class="dot"></span>03:00 SIGNAL / LIVE</div><div id="clock">--:--:--</div></header>
<main class="main">
<div class="kicker" id="kicker">unknown transmission #0001</div>
<div class="idea" id="idea">観測されるたびに、ルールを変える都市。</div>
<div class="meta" id="meta"></div>
<div class="prompt" id="prompt">人間の行動ログを「環境そのものへのフィードバック」と見なしたら、都市OSは最適化ではなく進化を始めるだろうか。</div>
</main>
<footer class="bottom"><div class="counter">TAP = NEXT SIGNAL<br>保存はしません。忘れる前提です。</div><button id="next">受信する ↗</button></footer>
</div>
<script>
const A=[['進化','淘汰圧'],['都市','群集'],['記憶','忘却'],['経済','価格'],['言語','意味'],['AI','エージェント'],['生物','代謝'],['ゲーム','ルール'],['音楽','リズム'],['物理','境界'],['教育','評価'],['市場','需要'],['ネットワーク','伝播'],['デザイン','摩擦'],['時間','遅延'],['組織','権限']];
const B=['観測されるたびに、自分のルールを変える','失敗だけを燃料にして成長する','最適化されるほど、わざと不便になる','ユーザーが触らない時だけ学習する','未来の結果から現在の判断を評価する','人間より先に「飽きる」ことを覚える','正解を保存せず、誤りだけ保存する','使われるほど、機能を減らしていく','互いに違う目的を持つ個体が協調する','説明できない案だけを一定確率で生かす','コピーされるたびに少しずつ変異する','便利さではなく、驚きの残存率を最大化する'];
const C=['都市','AI研究所','学習アプリ','会社','市場','SNS','OS','検索エンジン','ロボット群','学校','ゲーム世界','個人用AI','Webサービス','意思決定システム'];
const Q=['これを本当に作るなら、最初に測るべき変数は何か。','この仕組みが壊れる条件を先に3つ定義できるか。','性能ではなく「生存」を目的関数にすると何が変わるか。','人間の直感と逆の設計を1つだけ採用するとしたら何か。','追加の計算資源を入れたとき、限界効用が正になる閉ループを作れるか。','現実データを1週間だけ取るなら、何をログに残すべきか。','これを10円で検証する方法と、10万円で検証する方法はどう違うか。','「うまくいった」が錯覚だったと判定する反証条件は何か。'];
let n=1;const idea=document.querySelector('#idea'),meta=document.querySelector('#meta'),prompt=document.querySelector('#prompt'),kicker=document.querySelector('#kicker');
function pick(x){return x[Math.floor(Math.random()*x.length)]}
function gen(){const a=pick(A),b=pick(B),c=pick(C),q=pick(Q);n++;idea.classList.add('swap');setTimeout(()=>{idea.textContent=`${b}${c}。`;kicker.textContent=`unknown transmission #${String(n).padStart(4,'0')}`;meta.innerHTML=`<span class="chip">${a[0]}</span><span class="chip">${a[1]}</span><span class="chip">${c}</span>`;prompt.textContent=`${a[0]}の考え方を${c}へ移植する。${q}`;idea.classList.remove('swap');burst()},170)}
document.querySelector('#next').addEventListener('click',gen);document.body.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')gen()});
meta.innerHTML='<span class="chip">観測</span><span class="chip">適応</span><span class="chip">都市OS</span>';
setInterval(()=>document.querySelector('#clock').textContent=new Date().toLocaleTimeString('ja-JP',{hour12:false}),1000);
const cv=document.querySelector('#field'),ctx=cv.getContext('2d');let w,h,pts=[];
function resize(){w=cv.width=innerWidth*devicePixelRatio;h=cv.height=innerHeight*devicePixelRatio;pts=Array.from({length:Math.min(95,Math.floor(innerWidth/6))},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random()+.15,v:Math.random()*.18+.025}))}
function draw(){ctx.clearRect(0,0,w,h);for(const p of pts){p.y-=p.v*devicePixelRatio;if(p.y<0){p.y=h;p.x=Math.random()*w}ctx.globalAlpha=.18+p.z*.35;ctx.fillStyle='#d8ff72';ctx.fillRect(p.x,p.y,Math.max(1,p.z*1.4*devicePixelRatio),Math.max(1,p.z*1.4*devicePixelRatio))}requestAnimationFrame(draw)}
function burst(){for(let i=0;i<9;i++)pts.push({x:w*.5+(Math.random()-.5)*w*.3,y:h*.52+(Math.random()-.5)*h*.18,z:1.2,v:Math.random()*.6+.2});if(pts.length>130)pts.splice(0,pts.length-110)}
addEventListener('resize',resize);resize();draw();
</script>
</body>
</html>
